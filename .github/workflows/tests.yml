name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lint tooling
        run: python -m pip install ruff
      - name: Format and lint
        run: |
          ruff format --check .
          ruff check .
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Validate sources and vendored copies
        run: |
          python tools/validate.py
          python tools/vendor.py --check
          python tools/hygiene.py files
      - name: Package and install smoke test
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          python tools/package.py --zip --out "$tmp/dist"
          python tools/install.py --target "$tmp/target"
          python tools/validate.py --installed "$tmp/target"
          python "$tmp/target/.agents/skills/sw-init/scripts/workspace.py" --help
          python "$tmp/target/.agents/skills/sw-start/scripts/render_diagram.py" --help
          python "$tmp/target/.agents/skills/sw-start/scripts/start.py" --help
          python "$tmp/target/.agents/skills/sw-start/scripts/graph.py" --help
          python "$tmp/target/.agents/skills/sw-plan/scripts/check_tasks.py" --help
          python "$tmp/target/.agents/skills/sw-init/scripts/workspace.py" init \
            --root "$tmp/workspace" --mode flat --scope REF --name Refunds --project-key PROJ
          python "$tmp/target/.agents/skills/sw-lint/scripts/sw_lint.py" \
            --root "$tmp/workspace" --gate draft
          python "$tmp/target/.agents/skills/sw-start/scripts/graph.py" \
            build --cwd "$tmp/workspace"
          python "$tmp/target/.agents/skills/sw-start/scripts/graph.py" \
            check --cwd "$tmp/workspace"

  docker:
    runs-on: ubuntu-latest
    container: python:3.15-slim
    steps:
      - name: Install git and lint tooling
        run: |
          apt-get update -qq
          apt-get install -qq -y --no-install-recommends git
          python -m pip install ruff
      - uses: actions/checkout@v7
      - name: Format and lint
        run: |
          ruff format --check .
          ruff check .
      - name: Unit tests
        run: python -m unittest discover -s tests -t .
      - name: Validate sources and vendored copies
        run: |
          python tools/validate.py
          python tools/vendor.py --check
          python tools/hygiene.py files
