name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lint tooling
        run: python -m pip install ruff
      - name: Format and lint
        run: |
          ruff format --check --config workshop/pyproject.toml .
          ruff check --config workshop/pyproject.toml .
      - name: Unit tests
        run: python -m unittest discover -s workshop/tests -t workshop
      - name: Validate sources
        run: |
          python workshop/tools/validate.py
          python workshop/tools/vendor.py --check
          python workshop/tools/hygiene.py files
      - name: Skill installed alone smoke test
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          cp -R skills/sw-start "$tmp/sw-start"
          python "$tmp/sw-start/scripts/start.py" --help
      - name: Package and install smoke test
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          python workshop/tools/package.py --zip --out "$tmp/dist"
          python workshop/tools/install.py --target "$tmp/target"
          python workshop/tools/validate.py --installed "$tmp/target"
          S="$tmp/target/.agents/skills"
          python "$S/sw-start/scripts/workspace.py" --help
          python "$S/sw-start/scripts/start.py" --help
          python "$S/sw-start/_shared/scripts/graph.py" --help
          python "$S/sw-spec/scripts/render_diagram.py" --help
          python "$S/sw-plan/scripts/check_tasks.py" --help
          python "$S/sw-start/scripts/workspace.py" init \
            --root "$tmp/workspace" --mode flat --scope REF --name Refunds --project-key PROJ
          python "$S/sw-start/_shared/scripts/sw_lint.py" \
            --root "$tmp/workspace" --gate draft
          python "$S/sw-start/_shared/scripts/graph.py" build --cwd "$tmp/workspace"
          python "$S/sw-start/_shared/scripts/graph.py" check --cwd "$tmp/workspace"
          python "$S/sw-ingest/_shared/scripts/cite.py" verify --cwd "$tmp/workspace"

  docker:
    runs-on: ubuntu-latest
    container: python:3.15-slim
    steps:
      - name: Install git and lint tooling
        run: |
          apt-get update -qq
          apt-get install -qq -y --no-install-recommends git
          python -m pip install ruff
      - uses: actions/checkout@v7
      - name: Format and lint
        run: |
          ruff format --check --config workshop/pyproject.toml .
          ruff check --config workshop/pyproject.toml .
      - name: Unit tests
        run: python -m unittest discover -s workshop/tests -t workshop
      - name: Validate sources
        run: |
          python workshop/tools/validate.py
          python workshop/tools/vendor.py --check
          python workshop/tools/hygiene.py files

  runtime-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check and plan run without Python, and install needs consent
        shell: powershell
        run: |
          $script = "skills/_shared/scripts/runtime.ps1"
          $found = powershell -NoProfile -File $script check -Json | ConvertFrom-Json
          if ($null -eq $found.python.ok -or $null -eq $found.node.ok) { throw "check printed no report" }
          powershell -NoProfile -File $script plan node
          powershell -NoProfile -File $script plan python
          powershell -NoProfile -File $script install node
          if ($LASTEXITCODE -ne 3) { throw "install without -Yes must exit 3, got $LASTEXITCODE" }
          $global:LASTEXITCODE = 0
      - name: A matching archive installs and a mismatch stops before unpacking
        shell: powershell
        run: |
          $script = (Resolve-Path "skills/_shared/scripts/runtime.ps1").Path
          $work = Join-Path $env:RUNNER_TEMP "runtime-test"
          $name = "node-v24.0.0-test-win-x64"
          $folder = Join-Path $work $name
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          Set-Content -LiteralPath (Join-Path $folder "node.exe") -Value "stub"
          $zip = Join-Path $work "$name.zip"
          Compress-Archive -Path $folder -DestinationPath $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $env:SPECWRIGHT_RUNTIME_TEST_BASE = ([Uri]$work).AbsoluteUri
          $env:SPECWRIGHT_HOME = Join-Path $work "home-good"
          Set-Content -LiteralPath (Join-Path $work "runtime-pins.tsv") -Value "base`thttps://nodejs.org/dist/v24.0.0`nwin-x64`t$name.zip`t$hash"
          powershell -NoProfile -File $script install node -Yes
          if ($LASTEXITCODE -ne 0) { throw "install failed with $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $env:SPECWRIGHT_HOME "runtime\$name\node.exe"))) { throw "node.exe was not installed" }
          $env:SPECWRIGHT_HOME = Join-Path $work "home-bad"
          Set-Content -LiteralPath (Join-Path $work "runtime-pins.tsv") -Value "base`thttps://nodejs.org/dist/v24.0.0`nwin-x64`t$name.zip`t$('0' * 64)"
          powershell -NoProfile -File $script install node -Yes
          if ($LASTEXITCODE -ne 2) { throw "a checksum mismatch must exit 2, got $LASTEXITCODE" }
          if (Test-Path (Join-Path $env:SPECWRIGHT_HOME "runtime\$name")) { throw "a rejected archive was unpacked" }
          $global:LASTEXITCODE = 0

  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Packed console matches the source
        run: python workshop/tools/console_pack.py --check
      - name: Install, check, test and build
        working-directory: console
        run: |
          python ../workshop/tools/gen_console_contract.py
          npm ci --ignore-scripts
          npm run check
          npm test
          npm run build
      - name: Pins are current
        run: python workshop/tools/pin_node.py --check
