[project]
name = "specwright"
version = "0.3.0"
description = "Portable agent skills that take a software idea from source material to implementation-ready work: a guided start, shaped ideas, testable specs, diagrams, a linked knowledge graph and traceable stories or tasks, as detailed Markdown or Jira issues"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["skills/_shared/scripts/kitlib"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["kitlib", "tests"]

[tool.ruff.lint.per-file-ignores]
# Skill scripts locate the shared library before importing it.
"skills/**/scripts/*.py" = ["E402"]
