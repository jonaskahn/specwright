[project]
name = "specwright"
version = "0.1.0"
description = "Portable agent skills for business analysts, with Jira as the system of record"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["skills/*/scripts/kitlib"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["kitlib", "tests"]

[tool.ruff.lint.per-file-ignores]
# Skill scripts locate the shared library before importing it.
"skills/**/scripts/*.py" = ["E402"]
