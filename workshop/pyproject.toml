[project]
name = "specwright"
version = "1.0.0"
description = "Portable agent skills with two roles over one pipeline: a BA who turns an idea, a source or an existing system into accepted stories, criteria, diagrams and tasks, and a Dev who turns each accepted story into a very detailed, ready-to-apply implementation plan with one prompt per task and real task status; optional Jira publishing and a read-only console."
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["skills/_shared/scripts/kitlib"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["kitlib", "tests"]

[tool.ruff.lint.per-file-ignores]
# Skill scripts locate the shared library before importing it.
"skills/**/scripts/*.py" = ["E402"]
